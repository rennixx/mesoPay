name: mesopotamia_sdk
description: Unified Iraqi payment gateway SDK supporting ZainCash, FastPay, and FIB
version: 0.1.0
homepage: https://github.com/mesopotamia-sdk/mesopotamia-sdk
repository: https://github.com/mesopotamia-sdk/mesopotamia-sdk
issue_tracker: https://github.com/mesopotamia-sdk/mesopotamia-sdk/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.0.0
  url_launcher: ^6.1.0
  flutter_localizations:
    sdk: flutter
  http: ^1.1.0
  intl: ^0.20.2
  crypto: ^3.0.0
  convert: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      web:
        pluginClass: MesopotamiaWeb
        fileName: mesopotamia_web.dart
