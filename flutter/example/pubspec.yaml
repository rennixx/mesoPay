name: mesopotamia_example
description: Mesopotamia SDK Example App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mesopotamia_sdk:
    path: ../
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Deep linking configuration
  # Add this to your AndroidManifest.xml and iOS Info.plist
  # For Android:
  # <intent-filter>
  #   <action android:name="android.intent.action.VIEW" />
  #   <category android:name="android.intent.category.DEFAULT" />
  #   <category android:name="android.intent.category.BROWSABLE" />
  #   <data android:scheme="myapp" />
  # </intent-filter>
  #
  # For iOS:
  # <key>CFBundleURLTypes</key>
  # <array>
  #   <dict>
  #     <key>CFBundleURLSchemes</key>
  #     <array>
  #       <string>myapp</string>
  #     </array>
  #   </dict>
  # </array>
