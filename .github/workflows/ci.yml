name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Test Rust Core
  test-core:
    name: Test Core (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          components: rustfmt, clippy
      
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock') }}
      
      - name: Check formatting
        working-directory: core
        run: cargo fmt --all -- --check
      
      - name: Run Clippy
        working-directory: core
        run: cargo clippy --all-targets --all-features -- -D warnings
      
      - name: Run tests
        working-directory: core
        run: cargo test --all-features --verbose
      
      - name: Build release
        working-directory: core
        run: cargo build --release

  # Test Mock Gateway
  test-mock-gateway:
    name: Test Mock Gateway (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('mock-gateway/go.sum') }}
      
      - name: Download dependencies
        working-directory: mock-gateway
        run: go mod download
      
      - name: Run tests
        working-directory: mock-gateway
        run: go test -v ./...
      
      - name: Build
        working-directory: mock-gateway
        run: go build -v .

  # Test Flutter Package
  test-flutter:
    name: Test Flutter Package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      
      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get
      
      - name: Analyze code
        working-directory: flutter
        run: flutter analyze
      
      - name: Run tests
        working-directory: flutter
        run: flutter test
      
      - name: Build iOS (no codesign)
        working-directory: flutter/example
        run: flutter build ios --no-codesign
      
      - name: Build Android APK
        working-directory: flutter/example
        run: flutter build apk --debug

  # Test Node.js Package
  test-nodejs:
    name: Test Node.js Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nodejs/package-lock.json
      
      - name: Install dependencies
        working-directory: nodejs
        run: npm ci
      
      - name: Run linter
        working-directory: nodejs
        run: npm run lint
      
      - name: Run tests
        working-directory: nodejs
        run: npm test
      
      - name: Build
        working-directory: nodejs
        run: npm run build

  # Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
      
      - name: Install cargo-audit
        run: cargo install cargo-audit
      
      - name: Run cargo audit
        working-directory: core
        run: cargo audit
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run npm audit
        working-directory: nodejs
        run: npm audit --audit-level=high
        continue-on-error: true
