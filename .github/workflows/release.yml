name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Build and release Rust core for multiple platforms
  build-core:
    name: Build Core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: libmesopotamia.so
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: libmesopotamia.so
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: libmesopotamia.dylib
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: libmesopotamia.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mesopotamia.dll
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      
      - name: Build release
        working-directory: core
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: core-${{ matrix.target }}
          path: core/target/${{ matrix.target }}/release/${{ matrix.artifact }}

  # Build WebAssembly module
  build-wasm:
    name: Build WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          targets: wasm32-unknown-unknown
      
      - name: Install wasm-pack
        run: cargo install wasm-pack
      
      - name: Build Wasm
        working-directory: core
        run: wasm-pack build --target web --release
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: wasm-package
          path: core/pkg/

  # Publish Flutter package
  publish-flutter:
    name: Publish Flutter Package
    runs-on: ubuntu-latest
    needs: [build-core, build-wasm]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
      
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts
      
      - name: Copy native libraries
        run: |
          mkdir -p flutter/ios
          mkdir -p flutter/android/src/main/jniLibs/arm64-v8a
          mkdir -p flutter/android/src/main/jniLibs/x86_64
          # Copy artifacts to appropriate locations
      
      - name: Publish to pub.dev
        working-directory: flutter
        run: flutter pub publish --dry-run
        # For actual publishing: flutter pub publish -f

  # Publish Node.js package
  publish-nodejs:
    name: Publish Node.js Package
    runs-on: ubuntu-latest
    needs: [build-core]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts
      
      - name: Install dependencies
        working-directory: nodejs
        run: npm ci
      
      - name: Build
        working-directory: nodejs
        run: npm run build
      
      - name: Publish to npm
        working-directory: nodejs
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Create GitHub Release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-core, build-wasm]
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
